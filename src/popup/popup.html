<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lili</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <img src="../icons/icon-48.png" alt="" width="30" height="30" />
      <div class="titles">
        <strong>Lili</strong>
        <span id="provider">…</span>
      </div>
      <button type="button" id="options" class="link" data-i18n-title="popup_settings" data-i18n="popup_settings">
        Settings
      </button>
    </header>

    <main>
      <section>
        <div class="section-head">
          <span data-i18n="popup_selection">Selection</span>
          <span id="selection-count" class="count"></span>
        </div>
        <p id="selection-preview" class="preview" data-i18n="popup_no_selection">
          No selection detected.
        </p>
        <div id="selection-actions" class="actions"></div>
      </section>

      <section>
        <label class="section-head" for="text" data-i18n="popup_free_text">Free text</label>
        <textarea
          id="text"
          rows="3"
          data-i18n-placeholder="popup_placeholder"
          placeholder="Paste text to translate, rephrase or summarize…"
        ></textarea>
        <div id="text-actions" class="actions"></div>
      </section>

      <section>
        <button type="button" id="page-action" class="wide">
          <span data-i18n="popup_summarize_page">Summarize this page</span>
          <span class="kbd">Ctrl+Shift+E</span>
        </button>
      </section>

      <p id="notice" class="notice" hidden></p>
    </main>

    <footer class="foot">
      <span data-i18n="popup_footer">Ctrl+Shift+Y translates the selection</span>
    </footer>

    <script src="../shared/i18n.js"></script>
    <script src="../shared/constants.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
